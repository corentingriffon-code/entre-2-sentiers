<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--dark); }
  .canvas { background: var(--dark); color: #fff; }

  .top { flex: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 64px 64px 0; position: relative; z-index: 2; }
  .badge { color: var(--tan); border-color: var(--tan); }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 2; }
  .stat { font-family: var(--font-display); color: var(--lime); font-size: 9.5rem; line-height: 0.9; }
  .caption { margin-top: 24px; font-family: var(--font-body); font-weight: 600; font-size: 1.6rem; color: #fff; max-width: 780px; }
  .sub { margin-top: 16px; font-family: var(--font-body); color: var(--sage); font-size: 1.1rem; }

  .signoff { color: #fff; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag comprendre" style="color:#fff; background:rgba(255,255,255,0.12); border-color:#fff;">Marques</span>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10Z"/></svg>
        IPA
      </div>
    </div>
    <div class="main">
      <div class="stat">×11</div>
      <div class="caption">Les campagnes jugées les plus justes et mémorables font croître les parts de marché 11 fois plus que les autres.</div>
      <div class="sub">Les Binet &amp; Peter Field, IPA</div>
    </div>
    <div class="signoff" style="padding:0 64px 56px; display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span class="slide-index">6/8</span>
    </div>
  </div>
</body>
</html>
