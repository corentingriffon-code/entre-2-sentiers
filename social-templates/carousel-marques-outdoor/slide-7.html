<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--lime); }
  .canvas { background: var(--lime); color: var(--dark); }

  .top { flex: none; padding: 64px 64px 0; position: relative; z-index: 2; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 2; }
  .headline { font-family: var(--font-display); text-transform: uppercase; color: var(--dark); font-size: 3.9rem; line-height: 1; max-width: 900px; }
  .aside { font-family: var(--font-script); font-size: 2.2rem; color: var(--dark); margin-top: 28px; transform: rotate(-1.2deg); max-width: 760px; }

  .signoff { color: var(--dark); position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag comprendre" style="color:var(--dark); background:rgba(29,38,30,0.1);">Marques</span>
    </div>
    <div class="main">
      <div class="headline">HOKA a grandi uniquement par le bouche-à-oreille des ultra-traileurs.</div>
      <div class="aside">Aujourd'hui, elle est partout. Le modèle « peu mais juste » tient-il encore ?</div>
    </div>
    <div class="signoff" style="display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span class="slide-index">7/8</span>
    </div>
  </div>
</body>
</html>
