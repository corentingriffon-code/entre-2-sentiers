<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--sage); }
  .canvas { background: var(--sage); align-items: center; }

  .top { flex: none; width: 100%; padding: 64px 64px 0; position: relative; z-index: 2; }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 1.1rem; color: var(--dark); margin-top: 16px; max-width: 640px; }

  .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 60px; position: relative; z-index: 2; }
  .card { background: var(--cream); padding: 64px 56px; transform: rotate(-1.2deg); box-shadow: 0 24px 50px -20px rgba(29,38,30,0.5); max-width: 840px; }
  .quote { font-family: var(--font-script); color: var(--dark); font-size: 2.7rem; line-height: 1.22; text-align: center; }
  .source { text-align: center; font-family: var(--font-body); font-weight: 600; color: var(--dark); opacity: 0.6; font-size: 1rem; margin-top: 24px; text-transform: uppercase; letter-spacing: 0.03em; }

  .signoff { width: 100%; color: var(--dark); position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag comprendre" style="color:var(--dark);">Marques</span>
      <div class="eyebrow">Nnormal, la marque de Kilian Jornet, a annoncé... ne pas faire de marketing.</div>
    </div>
    <div class="main">
      <div class="card">
        <div class="quote">« Ce n'est pas celui qui parle le plus fort qui est entendu. C'est celui qui dit la chose juste, à la bonne personne. »</div>
        <div class="source">Nnormal</div>
      </div>
    </div>
    <div class="signoff" style="padding:0 64px 56px; display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span class="slide-index">5/8</span>
    </div>
  </div>
</body>
</html>
