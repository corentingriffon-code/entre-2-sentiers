<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--tan); }

  .canvas {
    background: var(--tan);
  }

  .top {
    flex: none;
    padding: 72px 72px 0;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }

  .headline {
    font-family: var(--font-display);
    color: var(--dark);
    font-size: 5.1rem;
    line-height: 1.04;
    letter-spacing: 0.01em;
    max-width: 880px;
  }

  .mark {
    color: var(--lime);
  }

  .signoff { color: var(--dark); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag partager" style="color:var(--dark);">Environnement</span>
    </div>
    <div class="main">
      <div class="headline">L'écologie dans le trail est-elle vraiment une question <span class="mark">binaire</span>&nbsp;?</div>
    </div>
    <div class="signoff">
      <span class="brand">Entre 2 sentiers</span>
      <span style="font-family:var(--font-body); font-weight:500; opacity:0.6;">entre2sentiers.com</span>
    </div>
  </div>
</body>
</html>
