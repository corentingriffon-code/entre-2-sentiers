<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--sage); }

  .canvas {
    background: var(--sage);
  }

  .top {
    flex: none;
    width: 100%;
    padding: 72px 72px 0;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .quote {
    padding: 0 88px;
    font-family: var(--font-script);
    color: var(--dark);
    font-size: 3.6rem;
    line-height: 1.2;
    text-align: center;
  }

  .source {
    width: 100%;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 500;
    color: var(--dark);
    opacity: 0.65;
    font-size: 1.1rem;
    margin-top: 28px;
  }

  .signoff { width: 100%; color: var(--dark); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag partager" style="color:var(--dark);">Personnes</span>
    </div>
    <div class="main">
      <div class="quote">Les bénévoles sont une partie de l'UX&nbsp;— l'expérience utilisateur — de l'événement.</div>
      <div class="source">Extrait de « Et si les bénévoles étaient l'UX d'un événement sportif ? »</div>
    </div>
    <div class="signoff" style="padding:0 72px 64px; display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span style="font-family:var(--font-body); font-weight:500; opacity:0.6;">entre2sentiers.com</span>
    </div>
  </div>
</body>
</html>
