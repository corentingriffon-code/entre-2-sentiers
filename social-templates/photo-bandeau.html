<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--dark); }

  .canvas { background: var(--dark); }

  .photo-layer {
    background-image: url('../assets/onlyfans-snowboard-featured.jpg');
    background-position: 65% 35%;
  }

  .shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(29,38,30,0.15) 0%, rgba(29,38,30,0.2) 40%, rgba(29,38,30,0.96) 100%);
  }

  .top {
    flex: none;
    position: relative;
    z-index: 2;
    padding: 64px 64px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .wordmark {
    font-family: var(--font-display);
    color: #fff;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    border: 1.5px solid #fff;
    padding: 8px 16px;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 64px 36px;
    position: relative;
    z-index: 2;
  }

  .headline {
    font-family: var(--font-display);
    text-transform: uppercase;
    color: #fff;
    font-size: 4.6rem;
    line-height: 0.92;
    max-width: 880px;
    margin-top: 18px;
  }

  .tag.comprendre {
    color: #fff;
    background: rgba(255,255,255,0.14);
    border-color: #fff;
  }

  .signoff { color: #fff; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="photo-layer"></div>
    <div class="photo-tint"></div>
    <div class="shade"></div>

    <div class="top">
      <span class="wordmark">ENTRE 2 SENTIERS</span>
      <div class="badge" style="color:#fff;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10Z"/></svg>
        MARQUES
      </div>
    </div>

    <div class="main">
      <span class="tag comprendre">Marques</span>
      <div class="headline">Une marque doit-elle avoir un lien avec le sport ?</div>
    </div>

    <div class="signoff">
      <span class="brand">Entre 2 sentiers</span>
      <span style="font-family:var(--font-body); font-weight:600; opacity:0.8;">entre2sentiers.com</span>
    </div>
  </div>
</body>
</html>
