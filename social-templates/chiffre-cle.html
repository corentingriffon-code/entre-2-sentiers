<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--dark); }

  .canvas { background: var(--dark); color: #fff; }

  .top {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 64px 64px 0;
    position: relative;
    z-index: 2;
  }

  .badge { color: var(--tan); border-color: var(--tan); }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
    position: relative;
    z-index: 2;
  }

  .stat {
    font-family: var(--font-display);
    color: var(--lime);
    font-size: 8.4rem;
    line-height: 0.9;
  }
  .stat .unit {
    font-size: 2.6rem;
    color: var(--tan);
    margin-left: 10px;
  }

  .callouts {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .callout-row {
    display: flex;
    align-items: center;
  }
  .callout-row .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--lime);
    flex: none;
  }
  .callout-row .line {
    width: 54px;
    height: 0;
    border-top: 2px dotted var(--sage);
    flex: none;
    margin: 0 2px;
  }
  .callout-row .label {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.15rem;
    color: #fff;
  }

  .source {
    margin-top: 40px;
    font-family: var(--font-body);
    color: var(--sage);
    font-size: 1rem;
  }

  .signoff { color: #fff; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag partager" style="color:var(--dark);">Environnement</span>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10Z"/></svg>
        UTMB 2024
      </div>
    </div>

    <div class="main">
      <div class="stat">18 600<span class="unit">tonnes</span></div>

      <div class="callouts">
        <div class="callout-row">
          <span class="dot"></span><span class="line"></span>
          <span class="label">de CO₂e émises par le HOKA UTMB® Mont-Blanc</span>
        </div>
        <div class="callout-row">
          <span class="dot"></span><span class="line"></span>
          <span class="label">soit environ 1,6&nbsp;tonne par coureur</span>
        </div>
      </div>

      <div class="source">Extrait de « L'écologie dans le trail est-elle vraiment une question binaire ? »</div>
    </div>

    <div class="signoff" style="padding:0 64px 56px; display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span style="font-family:var(--font-body); font-weight:600; opacity:0.75;">entre2sentiers.com</span>
    </div>
  </div>
</body>
</html>
