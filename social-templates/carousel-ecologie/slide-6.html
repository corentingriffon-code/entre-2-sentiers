<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--dark); }
  .canvas { background: var(--dark); color: #fff; }

  .top { flex: none; padding: 64px 64px 0; position: relative; z-index: 2; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 2; }
  .headline { font-family: var(--font-display); text-transform: uppercase; font-size: 2.6rem; line-height: 1.05; color: #fff; margin-bottom: 36px; max-width: 820px; }
  .headline .mark { color: var(--lime); }

  .signoff { color: #fff; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag creer" style="color:var(--dark);">Événements</span>
    </div>
    <div class="main">
      <div class="headline">Pourquoi juge-t-on <span class="mark">un sport</span> et pas l'autre&nbsp;?</div>
      <div class="compare">
        <div class="col">
          <h4>UTMB 2024</h4>
          <p>Une vallée du Mont-Blanc, plusieurs jours, des coureurs du monde entier.</p>
        </div>
        <div class="col">
          <h4>Coupe du monde 2026</h4>
          <p>3 pays, 16 villes hôtes, 48 équipes. La plus grande de son histoire.</p>
        </div>
      </div>
    </div>
    <div class="signoff" style="padding:0 64px 56px; display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span class="slide-index">6/8</span>
    </div>
  </div>
</body>
</html>
