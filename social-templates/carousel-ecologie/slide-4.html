<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--tan); }
  .canvas { background: var(--tan); color: var(--dark); }

  .top { flex: none; padding: 64px 64px 0; position: relative; z-index: 2; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 2; }
  .big { font-family: var(--font-display); text-transform: uppercase; font-size: 4.6rem; line-height: 0.98; color: var(--dark); }
  .big .mark { color: var(--lime); -webkit-text-stroke: 2px var(--dark); }
  .punch { margin-top: 30px; font-family: var(--font-script); font-size: 2.6rem; color: var(--dark); transform: rotate(-1deg); }

  .signoff { color: var(--dark); position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="tag partager" style="color:var(--dark); background:rgba(29,38,30,0.1);">Environnement</span>
    </div>
    <div class="main">
      <div class="big">88% de cette<br>empreinte&nbsp;:<br><span class="mark">les déplacements.</span></div>
      <div class="punch">Pas les gobelets au ravito. Les avions.</div>
    </div>
    <div class="signoff" style="display:flex; align-items:center; justify-content:space-between;">
      <span class="brand">Entre 2 sentiers</span>
      <span class="slide-index">4/8</span>
    </div>
  </div>
</body>
</html>
